# Used by Portainer (Stacks → Add stack → Repository) on the TrueNAS server.
# Builds the image from the Dockerfile in this repo and serves the game on port 30080.
services:
  kawkab:
    build: .
    image: kawkab-al-adad:latest
    # rebuild from source on every (re)deploy, so Portainer's git polling picks up new commits
    pull_policy: build
    container_name: kawkab-al-adad
    ports:
      - "30080:80"
    restart: unless-stopped
